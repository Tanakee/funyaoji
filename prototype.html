<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>試作：操作の方式の比較（あとで捨てる）</title>
    <style>
      body { margin: 0; font-family: sans-serif; background: #efe9dc; color: #2b2b2b; display: flex; gap: 12px; padding: 12px; box-sizing: border-box; height: 100vh; }
      canvas { background: #f6f1e7; border: 1px solid #c9bfa9; border-radius: 8px; flex: 1; min-width: 0; height: 100%; }
      aside { width: 360px; overflow: hidden auto; font-size: 13px; padding-right: 8px; box-sizing: border-box; }
      h2 { font-size: 14px; margin: 14px 0 6px; }
      #modes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      button { padding: 7px 8px; border: 1px solid #a89f8c; background: #fff; border-radius: 6px; cursor: pointer; font-size: 13px; }
      button.on { background: #2b2b2b; color: #fff; }
      #hint { margin: 8px 0 0; line-height: 1.5; min-height: 3em; }
      label { display: grid; grid-template-columns: 1fr; gap: 2px; margin: 6px 0; }
      label input[type="range"] { width: 100%; margin: 0; box-sizing: border-box; }
      label.check { display: flex; gap: 6px; align-items: center; }
      output { color: #6b6252; font-variant-numeric: tabular-nums; }
      kbd { background: #fff; border: 1px solid #a89f8c; border-radius: 4px; padding: 0 5px; }
      .row { display: flex; gap: 6px; flex-wrap: wrap; }
      #pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 6px; }
      #pad div { display: grid; gap: 4px; text-align: center; font-size: 12px; font-weight: bold; }
      #pad button { font-size: 20px; padding: 12px 0; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
      #pad button.held { filter: brightness(0.8); }
      /* スマホ：物理の画面を上、操作のパネルを下に並べる */
      @media (max-width: 800px) {
        body { flex-direction: column; height: auto; padding: 8px; gap: 8px; }
        canvas { width: 100%; height: auto; flex: none; }
        aside { width: 100%; padding-right: 0; overflow: visible; }
      }
    </style>
  </head>
  <body>
    <canvas id="view" width="1100" height="720"></canvas>
    <aside>
      <strong>試作：操作の方式の比較</strong>
      <div id="pad"></div>
      <h2>体の候補</h2>
      <select id="body" style="width:100%"></select>
      <h2>方式</h2>
      <div id="modes"></div>
      <p id="hint"></p>
      <h2>入力（スマホ4台の代わり）</h2>
      <div id="inputs"></div>
      <label class="check"><input type="checkbox" id="mirror" />左を、右の逆向きに連動させる（2軸で操作）</label>
      <h2>操作</h2>
      <div class="row">
        <button id="demo">お手本を再生</button>
        <button id="reset">やり直し (R)</button>
        <button id="pause">一時停止 (Space)</button>
        <button id="step">1コマ進める</button>
      </div>
      <label><span>お手本の再生中に、自分で動かす関節</span>
        <select id="solo">
          <option value="">なし（お手本が全部動かす）</option>
          <option value="rightHip">右もも（Q/A）</option>
          <option value="leftHip">左もも（W/S）</option>
          <option value="rightKnee">右ひざ（O/L）</option>
          <option value="leftKnee">左ひざ（P/;）</option>
        </select>
      </label>
      <label><span>速さ <output id="slow-out">1倍</output></span><input type="range" id="slow" min="0.1" max="1" step="0.1" value="1" /></label>
      <h2>調整</h2>
      <div id="tune"></div>
      <label class="check"><input type="checkbox" id="upper" />腕を付ける</label>
    </aside>
    <script type="module" src="/src/screen/game/prototype/main.ts"></script>
  </body>
</html>
