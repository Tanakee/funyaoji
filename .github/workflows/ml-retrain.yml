# 物理が変わったら、理論値の記録を作り直して PR を出す（docs/ml.md の「物理の変更から記録の差し替えまでを自動にする」）。
# 1. 物理に関わるファイルが変わった PR で、物理の指紋を src/screen/game/ai/theory.json のものと比べる
# 2. 違っていたら、学習の流れ（ml/funyaoji_rl/pipeline.py）を流し、新しい theory.json を入れた PR を、元の PR のブランチに向けて出す
# 3. 人が動画（このワークフローの成果物）を見て、マージする
name: 理論値の記録の作り直し

on:
  pull_request:
    paths:
      - "src/screen/game/**"
      - "src/shared/messages.ts"
      - "package-lock.json"
      - ".github/workflows/ml-retrain.yml"
  workflow_dispatch:
    inputs:
      steps:
        description: "③ の学習のステップ数"
        default: "20000000"

permissions:
  contents: read

concurrency:
  group: ml-retrain-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  fingerprint:
    # フォークからの PR は、書き込みの権限が無いので流さない
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.fp.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: 依存を入れる
        run: npm ci

      - name: 物理の指紋を比べる
        id: fp
        run: node scripts/rl/fingerprint.ts --github-output

  retrain:
    needs: fingerprint
    if: needs.fingerprint.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
      pull-requests: write
    env:
      BASE_BRANCH: ${{ github.head_ref || github.ref_name }}
      RETRAIN_BRANCH: chore/retrain-${{ github.event.pull_request.number || github.run_id }}
      STEPS: ${{ inputs.steps || '20000000' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: 依存を入れる
        run: npm ci

      - name: 動画の日本語のフォントを入れる
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - uses: astral-sh/setup-uv@v6

      - name: Python の依存を入れる
        working-directory: ml
        run: uv sync

      - name: 学習し直して、記録を作り直す
        working-directory: ml
        run: uv run python -m funyaoji_rl.pipeline --steps "$STEPS"

      - name: 学習の記録と動画を残す
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-retrain-${{ github.run_id }}
          path: |
            ml/mlflow.db
            ml/mlartifacts/
            ml/runs/**/*.gif
            ml/runs/**/*.mp4
            ml/runs/**/*.json
          retention-days: 30

      - name: 新しい記録の PR を出す
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$RETRAIN_BRANCH"
          git add src/screen/game/ai/theory.json
          TIME=$(node -e "console.log(JSON.parse(require('fs').readFileSync('src/screen/game/ai/theory.json','utf8')).timeMs/1000)")
          git commit -m "chore: 物理の変更に合わせて、理論値の記録を作り直す（${TIME} 秒）"
          git push --force origin "$RETRAIN_BRANCH"
          if [ -z "$(gh pr list --head "$RETRAIN_BRANCH" --json number --jq '.[].number')" ]; then
            gh pr create --base "$BASE_BRANCH" --head "$RETRAIN_BRANCH" \
              --title "chore: 物理の変更に合わせて、理論値の記録を作り直す" \
              --body "$(printf '%s\n' \
                "物理の指紋が変わったので、学習し直して \`src/screen/game/ai/theory.json\` を作り直した（docs/ml.md の「物理の変更から記録の差し替えまでを自動にする」）。" \
                "" \
                "- 新しい理論値：${TIME} 秒" \
                "- 学習の記録と動画：${RUN_URL} の成果物（Artifacts）。マージする前に動画で走りを見る" \
                "- このワークフローが出した PR では CI が自動で流れないので、必要なら閉じて開き直す")"
          fi
