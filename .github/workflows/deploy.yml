name: Deploy

on:
  pull_request:
    # closed は、閉じた PR のプレビューを消すため
    types: [opened, synchronize, reopened, closed]
  # 本番へのデプロイは、main の CI が通ってから行う
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

# 同じ PR のデプロイと片付けは、同じグループで順に動かす
concurrency:
  group: deploy-${{ github.event_name == 'workflow_run' && 'production' || github.ref }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # フォークからの PR には Secrets が渡らないので、何もしない。本番は、main への push の CI が成功したときだけ
    if: >-
      (github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v5
        with:
          # workflow_run では、CI が確かめたコミットを使う
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: 依存を入れる
        run: npm ci

      - name: プレビューを作る
        if: github.event_name == 'pull_request'
        run: npx cf previews deploy > preview.json

      - name: プレビューの URL を PR にコメントする
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          url=$(jq -r '.preview_urls[0]' preview.json)
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --edit-last --create-if-none \
            --body "プレビュー：$url/screen"

      - name: 本番にデプロイする
        if: github.event_name == 'workflow_run'
        run: npx cf deploy

  cleanup:
    runs-on: ubuntu-latest
    # 閉じた（マージした）PR のプレビューを消す。そのプレビューの Durable Objects のデータも消える
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: 依存を入れる
        run: npm ci

      - name: プレビューを消す
        env:
          # cf previews deploy は、ブランチ名（GITHUB_HEAD_REF）をプレビューの名前にする
          PREVIEW_NAME: ${{ github.head_ref }}
        run: |
          # 名前の URL エンコードは cf がする。プレビューが無い（一度もデプロイされていない）ときの 404 は失敗にしない
          if npx cf previews delete "$PREVIEW_NAME" --worker funyaoji --force 2> error.log; then
            exit 0
          fi
          cat error.log >&2
          if grep -q '404 Not Found' error.log; then
            echo "プレビュー $PREVIEW_NAME が無いので、消すものは無い"
            exit 0
          fi
          exit 1
